[package]
name = "capability"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Milestone 36 (docs/adr/010-capabilities.md): authority as handles. A
# capability holds what it grants access to (the network context, the
# storage store), so holding one is the only way to reach it.
[dependencies]
diagnostics = { path = "../diagnostics" }
network = { path = "../network" }
origin = { path = "../origin" }
storage = { path = "../storage" }

[lints.rust]
unsafe_code = "forbid"
