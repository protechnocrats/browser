[package]
name = "engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Milestone 29 (docs/adr/005-engine-api-shape.md): the facade. The only
# crate a host (app, shell_*, a headless host) may use to drive the
# pipeline; `scripts/check-dependency-direction.sh` forbids hosts from
# depending on the internal crates below directly.
[dependencies]
diagnostics = { path = "../diagnostics" }
dom = { path = "../dom" }
html_parser = { path = "../html_parser" }
css_parser = { path = "../css_parser" }
style = { path = "../style" }
layout = { path = "../layout" }
text = { path = "../text" }
images = { path = "../images" }
network = { path = "../network" }
origin = { path = "../origin" }
# Milestone 40 (ADR 023): a page's script is a `script::ScriptEnvironment`;
# `js` provides the runtime it runs on (Boa).
script = { path = "../script" }
js = { path = "../js" }
# Milestone 36 (ADR 010): a page's grants, and the store a renderer's
# storage grant is re-created over.
capability = { path = "../capability" }
storage = { path = "../storage" }
# Milestone 37: the fingerprint policy pages run under (ADR 019 §3).
privacy = { path = "../privacy" }
rendering = { path = "../rendering" }
# Only to name the shared intra-page worker pool (Milestone 30).
rayon = "1"

[dev-dependencies]
# Milestone 37 tests set the profile's request filter.
network = { path = "../network" }
# Unit tests build script environments directly.
js = { path = "../js", features = ["test-support"] }
accessibility = { path = "../accessibility" }
diagnostics = { path = "../diagnostics", features = ["collector"] }

[lints.rust]
unsafe_code = "forbid"
