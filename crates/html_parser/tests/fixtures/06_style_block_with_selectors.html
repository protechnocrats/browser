<!DOCTYPE html>
<html>
<head>
<style>
  /* comment inside style */
  body { color: #333333; }
  .highlight, #hero { color: #ff0000 !important; }
  div.card > p { color: blue }
  a[href^="https"] { color: green }
</style>
</head>
<body>
  <div class="card" id="hero">
    <p>Some content referencing a &lt;tag&gt; literally.</p>
  </div>
</body>
</html>
