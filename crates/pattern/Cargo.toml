[package]
name = "pattern"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
diagnostics = { path = "../diagnostics" }
# Linear-time matching (no backtracking, no catastrophic blow-up) — the
# whole reason this crate exists; see the crate docs. Pure safe Rust.
regex = { version = "1", default-features = false, features = ["std", "unicode-perl", "unicode-case", "unicode-gencat", "perf"] }

[dev-dependencies]
diagnostics = { path = "../diagnostics", features = ["collector"] }

[lints.rust]
unsafe_code = "forbid"
