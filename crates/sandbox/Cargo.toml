[package]
name = "sandbox"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The renderer's operating-system sandbox (ADR 016 §6). A platform crate:
# `landlock` and `seccompiler` make system calls (they contain `unsafe`);
# this crate itself forbids it, and `deny.toml` keeps both out of every
# other crate.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"
libc = "0.2"

[lints.rust]
unsafe_code = "forbid"
