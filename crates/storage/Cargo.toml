[package]
name = "storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# Milestone 36 (docs/adr/010-capabilities.md): the profile's web storage —
# `localStorage` areas partitioned by storage key, their quota, and their
# persistence under the profile directory. Moved out of `js` so that a
# capability (`capability::StorageCapability`) can hold the store without
# the script crate owning it.
[dependencies]
diagnostics = { path = "../diagnostics" }
origin = { path = "../origin" }

[lints.rust]
unsafe_code = "forbid"
