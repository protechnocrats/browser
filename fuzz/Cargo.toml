[package]
name = "browser-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

# Deliberately its own workspace (empty [workspace] table) — the
# standard cargo-fuzz convention. Without this, Cargo would try to
# fold this crate into the parent workspace at ../Cargo.toml, which
# isn't what we want: this crate needs nightly + libFuzzer, the rest
# of the project deliberately doesn't.
[workspace]

[package.metadata]
cargo-fuzz = true

# `libfuzzer-sys` compiles libFuzzer's C++ runtime, so it is optional:
# `cargo test --no-default-features` builds the library and the
# stable-Rust replay/mutation tests on any machine, while `cargo fuzz`
# (default features) builds the real libFuzzer binaries.
[features]
default = ["libfuzzer"]
libfuzzer = ["dep:libfuzzer-sys"]

[lib]
name = "browser_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = { version = "0.4", optional = true }
html_parser = { path = "../crates/html_parser" }
css_parser = { path = "../crates/css_parser" }
style = { path = "../crates/style" }
images = { path = "../crates/images" }
network = { path = "../crates/network" }
origin = { path = "../crates/origin" }
dom = { path = "../crates/dom" }
# `test-support`: the fuzz workspace builds script environments directly.
js = { path = "../crates/js", features = ["test-support"] }
# Milestone 36: the profile files Browser Core reads back.
browser_core = { path = "../crates/browser_core" }
storage = { path = "../crates/storage" }
# Milestone 37: filter lists and DNS messages.
filter = { path = "../crates/filter" }
layout = { path = "../crates/layout" }
rendering = { path = "../crates/rendering" }
engine = { path = "../crates/engine" }
text = { path = "../crates/text" }
pattern = { path = "../crates/pattern" }
# Milestone 40: the WebIDL subset the bindings are generated from.
webidl = { path = "../crates/webidl" }
url = "2"

# One [[bin]] per fuzz target. scripts/fuzz-smoke.sh discovers targets
# from `cargo fuzz list`, so adding a target here is all that CI needs.
[[bin]]
name = "parse_document"
path = "fuzz_targets/parse_document.rs"
required-features = ["libfuzzer"]
test = false
doc = false
bench = false

[[bin]]
name = "parse_stylesheet"
path = "fuzz_targets/parse_stylesheet.rs"
required-features = ["libfuzzer"]
test = false
doc = false
bench = false

